name: Build I9500 SmartPack RR Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone SmartPack source
        run: |
          git clone --depth 1 --branch aosp https://github.com/SmartPack/SmartPack-Kernel-Project_ja3g.git kernel

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            zip \
            unzip \
            perl \
            python2 \
            gcc-arm-linux-gnueabi

      - name: Download Android NDK r14b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          unzip -q android-ndk-r14b-linux-x86_64.zip
          mv android-ndk-r14b $HOME/android-ndk-r14b

      - name: Build RR kernel
        working-directory: kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE="$HOME/android-ndk-r14b/toolchains/arm-linux-androideabi-4.9/prebuilt/linux-x86_64/bin/arm-linux-androideabi-"

          make -C . O=output_ja3g lineageos_@ja3g@_defconfig
          make -j2 -C . O=output_ja3g

          test -f output_ja3g/arch/arm/boot/zImage

          mkdir -p release_SmartPack
          cp output_ja3g/arch/arm/boot/zImage release_SmartPack/zImage

          grep 'CONFIG_DM_CRYPT=y' output_ja3g/.config

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: i9500-smartpack-kernel
          path: kernel/release_SmartPack/zImage